name: Native CI

on:
  push:
    branches: [master]
    paths:
      - 'native/**'
      - '.github/workflows/native-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'native/**'
      - '.github/workflows/native-ci.yml'

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            native/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libglib2.0-dev libpango1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libatk1.0-dev libasound2-dev libssl-dev

      - name: Run Rust tests
        working-directory: native
        run: cargo test --verbose
