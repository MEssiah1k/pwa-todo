[package]
name = "pwa-todo"
version = "0.1.0"
edition = "2021"
description = "A native desktop todo application built with Rust and iced"

[dependencies]
# UI framework
iced = { version = "0.14", features = ["image", "svg", "tokio", "canvas"] }

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (for Supabase sync - future)
reqwest = { version = "0.12", features = ["json"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Audio playback
rodio = "0.20"

# System integration
tray-icon = { version = "0.20", default-features = false, features = [] }
notify-rust = "4"
global-hotkey = "0.6"

# Window management
winit = "0.30"

# File dialogs
rfd = "0.15"

# Directory paths
dirs = "6"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"

[package.metadata.deb]
name = "pwa-todo"
depends = "libgtk-3-0, libglib2.0-0, libpango-1.0-0, libcairo2, libgdk-pixbuf2.0-0, libatk1.0-0, libasound2, libssl3"
section = "utils"
priority = "optional"
assets = [
    ["target/release/pwa-todo", "usr/bin/", "755"],
    ["../app/icon.svg", "usr/share/icons/hicolor/scalable/apps/pwa-todo.svg", "644"],
    ["pwa-todo.desktop", "usr/share/applications/", "644"],
]
